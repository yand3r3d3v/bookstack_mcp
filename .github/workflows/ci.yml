name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the release workflow run the same checks before publishing.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # The tests are TypeScript run by Node itself, which needs 22.18+; the built server runs on 20+.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
